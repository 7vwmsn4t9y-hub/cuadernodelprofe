<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#EEF1F4; --surface:#FFFFFF; --surface-2:#F5F7F9; --border:#DBE1E7;
  --ink:#1B2430; --ink-muted:#5B6B7A; --ink-faint:#8B98A5;
  --accent:#2F4E8C; --accent-ink:#FFFFFF; --accent-soft:#E4EAF5;
  --good:#2E7D4F; --good-soft:#E3F2E8;
  --warn:#9C6A14; --warn-soft:#FBEEDB;
  --bad:#B4483A; --bad-soft:#F7E4E1;
  --info:#3F6E8C; --info-soft:#E4EEF4;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(27,36,48,.06),0 6px 20px rgba(27,36,48,.07);
  --font-display:'Zilla Slab',Georgia,'Times New Roman',serif;
  --font-body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10151B; --surface:#1A222B; --surface-2:#202A33; --border:#2C3742;
    --ink:#E8ECF0; --ink-muted:#9FAEBB; --ink-faint:#6E7C89;
    --accent:#87A6E0; --accent-ink:#0F1620; --accent-soft:#22304C;
    --good:#5FBE86; --good-soft:#1C3126;
    --warn:#E0B054; --warn-soft:#3A2C13;
    --bad:#E28A7E; --bad-soft:#3A211D;
    --info:#7FADCC; --info-soft:#1E2E38;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#10151B; --surface:#1A222B; --surface-2:#202A33; --border:#2C3742;
  --ink:#E8ECF0; --ink-muted:#9FAEBB; --ink-faint:#6E7C89;
  --accent:#87A6E0; --accent-ink:#0F1620; --accent-soft:#22304C;
  --good:#5FBE86; --good-soft:#1C3126;
  --warn:#E0B054; --warn-soft:#3A2C13;
  --bad:#E28A7E; --bad-soft:#3A211D;
  --info:#7FADCC; --info-soft:#1E2E38;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{overflow-x:hidden;}
body{background:var(--paper); color:var(--ink); font-family:var(--font-body); margin:0;}
#app{max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:40px; overflow-x:hidden;}
button{font-family:inherit;}
input,button,textarea{color:inherit;}
::selection{background:var(--accent-soft);}

.topbar{position:sticky; top:0; z-index:5; background:var(--paper); padding:14px 16px 10px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border);}
.topbar h1{font-family:var(--font-display); font-size:19px; font-weight:600; margin:0; letter-spacing:.2px; text-wrap:balance; flex:1; line-height:1.25;}
.topbar .sub{font-size:12px; color:var(--ink-muted); margin-top:2px; font-weight:500;}
.iconbtn{width:36px; height:36px; border-radius:999px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
.iconbtn:active{background:var(--surface-2);}
.iconbtn svg{width:18px; height:18px; stroke:var(--ink); fill:none;}

.content{padding:16px; display:flex; flex-direction:column; gap:18px; flex:1; min-width:0;}

.brand{padding:22px 16px 6px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
.brand .kicker{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint); font-weight:600;}
.brand h1{font-family:var(--font-display); font-size:28px; font-weight:600; margin:4px 0 2px; text-wrap:balance;}
.brand .date{font-size:13px; color:var(--ink-muted);}

.school-block{display:flex; flex-direction:column; gap:8px;}
.school-title{font-family:var(--font-display); font-size:14px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; color:var(--ink-muted); padding-left:2px;}
.group-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px 14px; display:flex; align-items:center; gap:12px; cursor:pointer; box-shadow:var(--shadow);}
.group-card:active{background:var(--surface-2);}
.group-card .gc-main{flex:1; min-width:0;}
.group-card .gc-subject{font-weight:600; font-size:15px; line-height:1.3;}
.group-card .gc-meta{font-size:12.5px; color:var(--ink-muted); margin-top:3px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.tag{display:inline-flex; align-items:center; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; background:var(--accent-soft); color:var(--accent); white-space:nowrap;}
.tag.turno-tarde{background:var(--warn-soft); color:var(--warn);}
.gc-count{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-faint); flex-shrink:0; text-align:right;}
.chev{width:16px; height:16px; stroke:var(--ink-faint); fill:none; flex-shrink:0;}

.stat-row{display:flex; gap:10px;}
.stat{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:11px 12px; text-align:left; box-shadow:var(--shadow);}
.stat .stat-num{font-family:var(--font-mono); font-size:20px; font-weight:600; line-height:1;}
.stat .stat-label{font-size:11px; color:var(--ink-muted); margin-top:4px; font-weight:500;}

.action-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.action-tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 14px; display:flex; flex-direction:column; gap:10px; align-items:flex-start; cursor:pointer; box-shadow:var(--shadow);}
.action-tile:active{background:var(--surface-2);}
.action-tile svg{width:22px; height:22px; stroke:var(--accent); fill:none;}
.action-tile .at-label{font-weight:600; font-size:15px;}
.action-tile .at-sub{font-size:12px; color:var(--ink-muted);}
.action-tile.secondary{grid-column:1/-1; flex-direction:row; align-items:center; padding:13px 14px;}
.action-tile.secondary svg{width:18px; height:18px;}

.searchbox{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 12px;}
.searchbox svg{width:16px; height:16px; stroke:var(--ink-faint); fill:none; flex-shrink:0;}
.searchbox input{border:none; outline:none; background:transparent; font-size:14.5px; width:100%; font-family:var(--font-body);}

.tabs{display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:999px; border:1px solid var(--border); max-width:100%;}
.tab{flex:1; min-width:0; text-align:center; padding:8px 4px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--ink-muted); cursor:pointer; background:transparent; border:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tab.active{background:var(--accent); color:var(--accent-ink);}

.datebar{display:flex; align-items:center; gap:10px;}
.datebar input[type=date]{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 10px; font-size:14px; font-family:var(--font-body); color:var(--ink);}
.smallbtn{border:1px solid var(--border); background:var(--surface); border-radius:999px; padding:8px 13px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;}
.smallbtn:active{background:var(--surface-2);}

.att-summary-row{display:flex; gap:8px; flex-wrap:wrap;}
.chip{font-family:var(--font-mono); font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:999px;}
.chip.p{background:var(--good-soft); color:var(--good);}
.chip.a{background:var(--bad-soft); color:var(--bad);}
.chip.t{background:var(--warn-soft); color:var(--warn);}
.chip.j{background:var(--info-soft); color:var(--info);}

.roster{display:flex; flex-direction:column; gap:8px;}
.roster-row{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow);}
.roster-row .rr-name{flex:1; font-size:14px; font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer;}
.att-buttons{display:flex; gap:4px; flex-shrink:0;}
.attbtn{width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); font-family:var(--font-mono); font-size:12px; font-weight:700; cursor:pointer; color:var(--ink-muted);}
.attbtn.on-p{background:var(--good); border-color:var(--good); color:#fff;}
.attbtn.on-a{background:var(--bad); border-color:var(--bad); color:#fff;}
.attbtn.on-t{background:var(--warn); border-color:var(--warn); color:#fff;}
.attbtn.on-j{background:var(--info); border-color:var(--info); color:#fff;}

.notas-row{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:11px 12px; display:flex; align-items:center; gap:10px; cursor:pointer; box-shadow:var(--shadow);}
.notas-row:active{background:var(--surface-2);}
.notas-row .nr-name{flex:1; font-size:14px; font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.pill{font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap; flex-shrink:0;}
.pill.good{background:var(--good-soft); color:var(--good);}
.pill.warn{background:var(--warn-soft); color:var(--warn);}
.pill.bad{background:var(--bad-soft); color:var(--bad);}
.pill.faint{background:var(--surface-2); color:var(--ink-faint); border:1px solid var(--border);}

.eje-dots{display:flex; gap:3px; flex-shrink:0;}
.dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.dot-good{background:var(--good);}
.dot-warn{background:var(--warn);}
.dot-bad{background:var(--bad);}
.dot-faint{background:var(--ink-faint); opacity:.35;}

.quick-row{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 10px; display:flex; align-items:center; gap:8px; box-shadow:var(--shadow); min-width:0;}
.quick-row .qr-name{flex:1; font-size:13px; font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.qr-fields{display:flex; gap:5px; flex-shrink:0;}
.qr-fields .field input{width:38px; height:32px; font-size:13px;}

.student-header{display:flex; flex-direction:column; gap:2px;}
.student-header h2{font-family:var(--font-display); font-size:22px; font-weight:600; margin:0; text-wrap:balance;}
.student-header .sh-sub{font-size:12.5px; color:var(--ink-muted);}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;}
.card-title-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.card-title{font-weight:600; font-size:14.5px;}

.nota{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 0; border-top:1px solid var(--border);}
.nota:first-of-type{border-top:none; padding-top:0;}
.nota .nota-label{font-size:12px; color:var(--ink-muted); width:52px; flex-shrink:0; font-weight:500;}
.field{display:flex; flex-direction:column; gap:2px; align-items:center;}
.field label{font-size:9.5px; color:var(--ink-faint); font-weight:700; letter-spacing:.04em;}
.field input{width:42px; height:34px; text-align:center; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); font-family:var(--font-mono); font-size:14px; font-weight:600; color:var(--ink);}
.field input:focus{outline:2px solid var(--accent); outline-offset:1px;}

.finales-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.finales-item{display:flex; flex-direction:column; gap:4px;}
.finales-item .fi-label{font-size:11.5px; color:var(--ink-muted); font-weight:500;}
.finales-item input{border:1px solid var(--border); border-radius:8px; background:var(--surface-2); font-family:var(--font-mono); font-size:14px; font-weight:600; padding:8px; color:var(--ink); width:100%;}

.addrow{display:flex; gap:8px;}
.addrow input{flex:1; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); padding:10px 12px; font-size:14px; font-family:var(--font-body); color:var(--ink);}
.primarybtn{background:var(--accent); color:var(--accent-ink); border:none; border-radius:var(--radius-sm); padding:10px 16px; font-weight:600; font-size:13.5px; cursor:pointer;}
.primarybtn:active{opacity:.85;}
.ghostbtn{background:transparent; color:var(--bad); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:11.5px; font-weight:600; cursor:pointer;}

.manage-row{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 12px; display:flex; align-items:center; gap:8px; box-shadow:var(--shadow);}
.manage-row input{flex:1; border:none; background:transparent; font-size:14px; font-family:var(--font-body); color:var(--ink); padding:2px 0;}
.manage-row input:focus{outline:none; border-bottom:1px solid var(--accent);}

.empty-state{text-align:center; padding:40px 20px; color:var(--ink-muted); font-size:14px;}
.toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-size:12.5px; font-weight:600; padding:8px 16px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:50;}
.toast.show{opacity:.94;}
.att-history{display:flex; flex-direction:column; gap:6px;}
.hist-row{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 12px; box-shadow:var(--shadow);}
.hist-row .hd{font-family:var(--font-mono); font-size:12.5px; font-weight:600; width:78px; flex-shrink:0;}
.hist-bar{flex:1; height:8px; border-radius:999px; overflow:hidden; display:flex; background:var(--surface-2);}
.hist-bar span{height:100%;}
.note-box{background:var(--accent-soft); color:var(--accent); border-radius:var(--radius-sm); padding:11px 13px; font-size:12.5px; line-height:1.5;}
.backup-textarea{width:100%; min-height:140px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface-2); color:var(--ink); font-family:var(--font-mono); font-size:11px; padding:10px; resize:vertical;}
.filebtn{display:inline-block; border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-sm); padding:10px 16px; font-weight:600; font-size:13.5px; cursor:pointer; text-align:center;}
.filebtn input{display:none;}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>

<script>
(function(){
"use strict";

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d]=iso.split('-');
  const dias=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const dt=new Date(y,m-1,d);
  return dias[dt.getDay()]+' '+d+'/'+m+'/'+y;
}
const CURSO_ORDER={'PRIMER':1,'SEGUNDO':2,'TERCER':3,'CUARTO':4,'QUINTO':5,'SEXTO':6,'SEPTIMO':7};
function cursoRank(curso){
  const w=(curso||'').trim().split(' ')[0].toUpperCase();
  return CURSO_ORDER[w]||99;
}
function clampGrade(v){
  if(v===''||v==null) return null;
  let n=parseFloat(v);
  if(isNaN(n)) return null;
  if(n<1) n=1; if(n>10) n=10;
  return n;
}

function evalStatus(ev){
  ev=ev||{n:null,r1:null,r2:null};
  if(ev.r2!=null) return {final:ev.r2, tone:ev.r2>=7?'good':'bad', label:ev.r2>=7?'Aprobada':'Desaprobada'};
  if(ev.r1!=null) return ev.r1>=7 ? {final:ev.r1,tone:'good',label:'Aprobada (R1)'} : {final:ev.r1,tone:'warn',label:'Va a R2'};
  if(ev.n!=null) return ev.n>=7 ? {final:ev.n,tone:'good',label:'Aprobada'} : {final:ev.n,tone:'warn',label:'Va a R1'};
  return {final:null, tone:'faint', label:'Sin datos'};
}
function ejeStatus(eje){
  const s1=evalStatus(eje.evals[0]), s2=evalStatus(eje.evals[1]);
  if(s1.tone==='good' && s2.tone==='good') return {tone:'good', label:'Eje aprobado'};
  if(s1.tone==='bad' || s2.tone==='bad') return {tone:'bad', label:'Eje desaprobado'};
  if(s1.tone==='warn' || s2.tone==='warn') return {tone:'warn', label:'En recuperatorio'};
  if(s1.tone==='faint' && s2.tone==='faint') return {tone:'faint', label:'Sin comenzar'};
  return {tone:'faint', label:'Pendiente'};
}
function studentEjesAprobados(student){
  return student.ejes.filter(e=>ejeStatus(e).tone==='good').length;
}

/* ---------------- Store (100% local — localStorage on this device) ---------------- */
const Store=(function(){
  let groups={}, listeners=[], localAtt={};
  const LK='ayn_groups_v1', LAK='ayn_attendance_v1';
  function notify(){ listeners.forEach(fn=>fn()); }
  function onChange(fn){ listeners.push(fn); }
  function loadLocal(key,fallback){ try{ const r=localStorage.getItem(key); return r?JSON.parse(r):fallback; }catch(e){ return fallback; } }
  function saveLocalGroups(){ try{ localStorage.setItem(LK, JSON.stringify(groups)); return true; }catch(e){ console.error('save groups failed', e); return false; } }
  function saveLocalAtt(){ try{ localStorage.setItem(LAK, JSON.stringify(localAtt)); return true; }catch(e){ console.error('save attendance failed', e); return false; } }

  function init(){
    let local = loadLocal(LK, null);
    if(!local || Object.keys(local).length===0){
      local={};
      window.DATA_SEED.forEach(g=>{ local[g.id]=JSON.parse(JSON.stringify(g)); });
      groups=local;
      saveLocalGroups();
    } else groups=local;
    localAtt = loadLocal(LAK, {});
    notify();
  }
  function getGroups(){
    return Object.values(groups).sort((a,b)=>{
      if(a.school!==b.school) return a.school<b.school?-1:1;
      const cr=cursoRank(a.curso)-cursoRank(b.curso);
      if(cr) return cr;
      if(a.division!==b.division) return (a.division||'').localeCompare(b.division||'');
      return (a.subject||'').localeCompare(b.subject||'');
    });
  }
  function getGroup(id){ return groups[id]; }
  function saveGroup(group){
    groups[group.id]=group;
    saveLocalGroups();
    notify();
  }
  function getAttendance(gid,date){
    const g=localAtt[gid]||{};
    return g[date] || {date:date,records:{}};
  }
  function saveAttendance(gid,date,records){
    localAtt[gid]=localAtt[gid]||{};
    localAtt[gid][date]={date:date, records:records, updatedAt:new Date().toISOString()};
    saveLocalAtt();
  }
  function listAttendance(gid){
    const g=localAtt[gid]||{};
    return Object.values(g).sort((a,b)=> b.date<a.date?-1:1);
  }
  function exportAll(){
    return JSON.stringify({app:'cuaderno-del-profe', version:1, exportedAt:new Date().toISOString(), groups:groups, attendance:localAtt}, null, 0);
  }
  function importAll(jsonText){
    const data=JSON.parse(jsonText);
    if(!data || typeof data!=='object' || !data.groups || typeof data.groups!=='object'){
      throw new Error('Formato inválido');
    }
    groups=data.groups;
    localAtt=data.attendance||{};
    saveLocalGroups();
    saveLocalAtt();
    notify();
  }
  return {init,getGroups,getGroup,saveGroup,getAttendance,saveAttendance,listAttendance,onChange,exportAll,importAll};
})();

/* ---------------- App state / routing ---------------- */
let route={view:'home'};
let searchQ='';
let attDate=todayISO();
let attRecordsCache={};
let quickEje=0;
let quickNota=0;
let toastTimer=null;

function nav(r){ route=r; searchQ=''; render(); window.scrollTo(0,0); }
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1400);
}
function toastSoon(msg){
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast(msg), 250);
}

/* ---------------- Renderers ---------------- */
function renderTopbar(title,sub,backTo,rightHtml){
  return '<div class="topbar">'+
    (backTo? '<button class="iconbtn" data-nav="'+esc(JSON.stringify(backTo))+'">'+ICONS.back+'</button>':'')+
    '<div style="flex:1; min-width:0;"><h1>'+esc(title)+'</h1>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div>'+
    (rightHtml||'')+
    '</div>';
}

function renderHome(){
  const groups=Store.getGroups();
  const bySchool={};
  groups.forEach(g=>{ (bySchool[g.school]=bySchool[g.school]||[]).push(g); });
  let html='<div class="brand"><div><div class="kicker">Cuaderno del profe</div><h1>Asistencia &amp; Notas</h1><div class="date">'+esc(fmtDate(todayISO()))+'</div></div>'+
    '<button class="iconbtn" data-nav="'+esc(JSON.stringify({view:'backup'}))+'" title="Copia de seguridad">'+ICONS.shield+'</button></div>';
  html+='<div class="content">';
  Object.keys(bySchool).sort().forEach(school=>{
    html+='<div class="school-block"><div class="school-title">'+esc(school)+'</div>';
    bySchool[school].forEach(g=>{
      html+='<div class="group-card" data-nav="'+esc(JSON.stringify({view:'group',gid:g.id}))+'">'+
        '<div class="gc-main"><div class="gc-subject">'+esc(g.subject)+'</div>'+
        '<div class="gc-meta"><span>'+esc(g.curso)+' '+esc(g.division)+'</span>'+
        '<span class="tag'+(g.turno==='TARDE'?' turno-tarde':'')+'">'+esc(g.turno)+'</span></div></div>'+
        '<div class="gc-count">'+g.students.length+'<br>al.</div>'+ICONS.chev+
        '</div>';
    });
    html+='</div>';
  });
  html+='</div>';
  return html;
}

function renderGroup(gid){
  const g=Store.getGroup(gid);
  if(!g) return renderHome();
  const n=g.students.length;
  const aprobados=g.students.filter(s=>studentEjesAprobados(s)===4).length;
  const html=[];
  html.push(renderTopbar(g.subject, g.school+' · '+g.curso+' '+g.division+' · '+g.turno, {view:'home'}));
  html.push('<div class="content">');
  html.push('<div class="stat-row">'+
    '<div class="stat"><div class="stat-num">'+n+'</div><div class="stat-label">Alumnos</div></div>'+
    '<div class="stat"><div class="stat-num">'+aprobados+'/'+n+'</div><div class="stat-label">4 ejes aprobados</div></div>'+
    '</div>');
  html.push('<div class="action-grid">'+
    '<div class="action-tile" data-nav="'+esc(JSON.stringify({view:'attendance',gid:gid,tab:'take'}))+'">'+ICONS.check+'<div><div class="at-label">Asistencia</div><div class="at-sub">Tomar lista de hoy</div></div></div>'+
    '<div class="action-tile" data-nav="'+esc(JSON.stringify({view:'notas',gid:gid,tab:'quick'}))+'">'+ICONS.pencil+'<div><div class="at-label">Notas</div><div class="at-sub">Cargar notas de todos</div></div></div>'+
    '<div class="action-tile secondary" data-nav="'+esc(JSON.stringify({view:'manage',gid:gid}))+'">'+ICONS.users+'<div class="at-label" style="margin-left:4px;">Gestionar lista de alumnos</div></div>'+
    '</div>');
  html.push('</div>');
  return html.join('');
}

function renderSearch(placeholder){
  return '<div class="searchbox">'+ICONS.search+'<input type="text" id="searchInput" placeholder="'+esc(placeholder)+'" value="'+esc(searchQ)+'"></div>';
}
function filterStudents(students){
  if(!searchQ) return students;
  const q=searchQ.toLowerCase();
  return students.filter(s=>s.name.toLowerCase().includes(q));
}

function renderAttendance(gid, tab){
  const g=Store.getGroup(gid);
  if(!g) return renderHome();
  tab = tab||'take';
  const html=[];
  html.push(renderTopbar('Asistencia', g.subject+' · '+g.curso+' '+g.division, {view:'group',gid:gid}));
  html.push('<div class="content">');
  html.push('<div class="tabs">'+
    '<button class="tab'+(tab==='take'?' active':'')+'" data-nav="'+esc(JSON.stringify({view:'attendance',gid:gid,tab:'take'}))+'">Tomar asistencia</button>'+
    '<button class="tab'+(tab==='summary'?' active':'')+'" data-nav="'+esc(JSON.stringify({view:'attendance',gid:gid,tab:'summary'}))+'">Resumen</button>'+
    '</div>');

  if(tab==='take'){
    const rec = Store.getAttendance(gid, attDate);
    attRecordsCache = Object.assign({}, rec.records||{});
    const counts={P:0,A:0,T:0,J:0};
    Object.values(attRecordsCache).forEach(v=>{ if(counts[v]!=null) counts[v]++; });
    html.push('<div class="datebar"><input type="date" id="attDateInput" value="'+esc(attDate)+'"></div>');
    html.push('<div class="att-summary-row">'+
      '<span class="chip p">P '+counts.P+'</span><span class="chip a">A '+counts.A+'</span>'+
      '<span class="chip t">T '+counts.T+'</span><span class="chip j">J '+counts.J+'</span></div>');
    html.push('<div class="datebar"><button class="smallbtn" id="markAllPresent">Marcar todos presentes</button>'+
      '<button class="smallbtn" id="clearAll">Limpiar</button></div>');
    html.push(renderSearch('Buscar alumno…'));
    const students=filterStudents(g.students);
    html.push('<div class="roster">');
    students.forEach(s=>{
      const st=attRecordsCache[s.id]||'';
      html.push('<div class="roster-row"><div class="rr-name">'+esc(s.name)+'</div><div class="att-buttons">'+
        ['P','T','J','A'].map(code=>'<button class="attbtn'+(st===code?' on-'+code.toLowerCase():'')+'" data-att="'+esc(s.id)+'" data-code="'+code+'">'+code+'</button>').join('')+
        '</div></div>');
    });
    html.push('</div>');
    if(students.length===0) html.push('<div class="empty-state">Sin resultados.</div>');
  } else {
    const history = Store.listAttendance(gid);
    const totals={};
    g.students.forEach(s=>totals[s.id]={P:0,A:0,T:0,J:0,total:0});
    history.forEach(h=>{
      Object.entries(h.records||{}).forEach(([sid,code])=>{
        if(!totals[sid]) return;
        if(totals[sid][code]!=null) totals[sid][code]++;
        totals[sid].total++;
      });
    });
    html.push('<div class="stat-row"><div class="stat"><div class="stat-num">'+history.length+'</div><div class="stat-label">Clases registradas</div></div></div>');
    if(history.length===0){
      html.push('<div class="empty-state">Todavía no hay asistencia guardada para este grupo.</div>');
    } else {
      html.push('<div class="att-history">');
      g.students.forEach(s=>{
        const t=totals[s.id];
        const pct = t.total? Math.round((t.P/t.total)*100):null;
        html.push('<div class="hist-row"><div class="hd">'+(pct==null?'–':pct+'%')+'</div>'+
          '<div style="flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">'+esc(s.name)+'</div>'+
          '<div class="hist-bar" style="width:70px;">'+
            (t.total? '<span style="background:var(--good); width:'+(t.P/t.total*100)+'%"></span><span style="background:var(--warn); width:'+(t.T/t.total*100)+'%"></span><span style="background:var(--info); width:'+(t.J/t.total*100)+'%"></span><span style="background:var(--bad); width:'+(t.A/t.total*100)+'%"></span>':'')+
          '</div></div>');
      });
      html.push('</div>');
    }
  }
  html.push('</div>');
  return html.join('');
}

function renderNotas(gid, tab){
  const g=Store.getGroup(gid);
  if(!g) return renderHome();
  tab = tab||'list';
  const html=[];
  html.push(renderTopbar('Notas', g.subject+' · '+g.curso+' '+g.division, {view:'group',gid:gid}));
  html.push('<div class="content">');
  html.push('<div class="tabs">'+
    '<button class="tab'+(tab==='quick'?' active':'')+'" data-nav="'+esc(JSON.stringify({view:'notas',gid:gid,tab:'quick'}))+'">Carga rápida</button>'+
    '<button class="tab'+(tab==='list'?' active':'')+'" data-nav="'+esc(JSON.stringify({view:'notas',gid:gid,tab:'list'}))+'">Por alumno</button>'+
    '</div>');

  if(tab==='quick'){
    html.push('<div class="tabs">'+[0,1,2,3].map(i=>'<button class="tab'+(quickEje===i?' active':'')+'" data-quickeje="'+i+'">Eje '+(i+1)+'</button>').join('')+'</div>');
    html.push('<div class="tabs">'+[0,1].map(i=>'<button class="tab'+(quickNota===i?' active':'')+'" data-quicknota="'+i+'">Nota '+(i+1)+'</button>').join('')+'</div>');
    html.push(renderSearch('Buscar alumno…'));
    const students=filterStudents(g.students);
    html.push('<div class="roster">');
    students.forEach(s=>{
      const ev=s.ejes[quickEje].evals[quickNota];
      const vs=evalStatus(ev);
      const showR1 = ev.n!=null && ev.n<7;
      const showR2 = showR1 && ev.r1!=null && ev.r1<7;
      html.push('<div class="quick-row"><div class="qr-name">'+esc(s.name)+'</div><div class="qr-fields">'+
        quickField(s.id,'n',ev.n)+
        (showR1?quickField(s.id,'r1',ev.r1):'')+
        (showR2?quickField(s.id,'r2',ev.r2):'')+
        '</div><span class="dot dot-'+vs.tone+'" title="'+esc(vs.label)+'"></span></div>');
    });
    html.push('</div>');
    if(students.length===0) html.push('<div class="empty-state">Sin resultados.</div>');
  } else {
    html.push(renderSearch('Buscar alumno…'));
    const students=filterStudents(g.students);
    html.push('<div class="roster">');
    students.forEach(s=>{
      const ap=studentEjesAprobados(s);
      let tone='faint', label=ap+'/4';
      if(ap===4){tone='good'; label='4/4';}
      else if(s.ejes.some(e=>ejeStatus(e).tone==='bad')) {tone='bad'; label=ap+'/4';}
      else if(s.ejes.some(e=>ejeStatus(e).tone==='warn')) {tone='warn'; label=ap+'/4';}
      const dots=s.ejes.map(e=>'<span class="dot dot-'+ejeStatus(e).tone+'"></span>').join('');
      html.push('<div class="notas-row" data-nav="'+esc(JSON.stringify({view:'student',gid:gid,sid:s.id}))+'">'+
        '<div class="nr-name">'+esc(s.name)+'</div><div class="eje-dots">'+dots+'</div><span class="pill '+tone+'">'+esc(label)+'</span>'+ICONS.chev+'</div>');
    });
    html.push('</div>');
    if(students.length===0) html.push('<div class="empty-state">Sin resultados.</div>');
  }
  html.push('</div>');
  return html.join('');
}

function notaField(sid,eIdx,evIdx,field,val){
  return '<div class="field"><label>'+field.toUpperCase()+'</label>'+
    '<input type="number" min="1" max="10" inputmode="numeric" '+
    'data-grade="1" data-sid="'+esc(sid)+'" data-e="'+eIdx+'" data-ev="'+evIdx+'" data-f="'+field+'" '+
    'value="'+(val==null?'':val)+'"></div>';
}
function quickField(sid,field,val){
  return '<div class="field"><label>'+field.toUpperCase()+'</label>'+
    '<input type="number" min="1" max="10" inputmode="numeric" enterkeyhint="next" '+
    'data-grade="1" data-quick="1" data-sid="'+esc(sid)+'" data-e="'+quickEje+'" data-ev="'+quickNota+'" data-f="'+field+'" '+
    'value="'+(val==null?'':val)+'"></div>';
}

function renderStudent(gid,sid){
  const g=Store.getGroup(gid);
  if(!g) return renderHome();
  const s=g.students.find(x=>x.id===sid);
  if(!s) return renderNotas(gid,'list');
  const html=[];
  html.push(renderTopbar('Alumno', g.subject, {view:'notas',gid:gid,tab:'list'}));
  html.push('<div class="content">');
  html.push('<div class="student-header"><h2>'+esc(s.name)+'</h2><div class="sh-sub">'+esc(g.curso)+' '+esc(g.division)+' · '+esc(g.subject)+'</div></div>');

  s.ejes.forEach((eje,ei)=>{
    const est=ejeStatus(eje);
    html.push('<div class="card"><div class="card-title-row"><div class="card-title">Eje '+(ei+1)+'</div><span class="pill '+est.tone+'">'+esc(est.label)+'</span></div>');
    eje.evals.forEach((ev,vi)=>{
      const vs=evalStatus(ev);
      const showR1 = ev.n!=null && ev.n<7;
      const showR2 = showR1 && ev.r1!=null && ev.r1<7;
      html.push('<div class="nota"><div class="nota-label">Nota '+(vi+1)+'</div>'+
        notaField(sid,ei,vi,'n',ev.n)+
        (showR1?notaField(sid,ei,vi,'r1',ev.r1):'')+
        (showR2?notaField(sid,ei,vi,'r2',ev.r2):'')+
        '<span class="pill '+vs.tone+'" style="margin-left:auto;">'+esc(vs.label)+'</span>'+
        '</div>');
    });
    html.push('</div>');
  });

  html.push('<div class="card"><div class="card-title">Instancias finales</div><div class="finales-grid">'+
    '<div class="finales-item"><div class="fi-label">JIS 1 – Nota</div><input type="number" min="1" max="10" data-grade="1" data-sid="'+esc(sid)+'" data-special="jis1n" value="'+(s.jis1.n==null?'':s.jis1.n)+'"></div>'+
    '<div class="finales-item"><div class="fi-label">JIS 1 – Recup.</div><input type="number" min="1" max="10" data-grade="1" data-sid="'+esc(sid)+'" data-special="jis1r" value="'+(s.jis1.r==null?'':s.jis1.r)+'"></div>'+
    '<div class="finales-item"><div class="fi-label">JIS 2 – Nota</div><input type="number" min="1" max="10" data-grade="1" data-sid="'+esc(sid)+'" data-special="jis2n" value="'+(s.jis2.n==null?'':s.jis2.n)+'"></div>'+
    '<div class="finales-item"><div class="fi-label">JIS 2 – Recup.</div><input type="number" min="1" max="10" data-grade="1" data-sid="'+esc(sid)+'" data-special="jis2r" value="'+(s.jis2.r==null?'':s.jis2.r)+'"></div>'+
    '<div class="finales-item"><div class="fi-label">Coloquio Dic.</div><input type="number" min="1" max="10" data-grade="1" data-sid="'+esc(sid)+'" data-special="coloquioDic" value="'+(s.coloquioDic==null?'':s.coloquioDic)+'"></div>'+
    '<div class="finales-item"><div class="fi-label">Coloquio Feb.</div><input type="number" min="1" max="10" data-grade="1" data-sid="'+esc(sid)+'" data-special="coloquioFeb" value="'+(s.coloquioFeb==null?'':s.coloquioFeb)+'"></div>'+
    '<div class="finales-item" style="grid-column:1/-1;"><div class="fi-label">Promedio final</div><input type="number" min="1" max="10" data-grade="1" data-sid="'+esc(sid)+'" data-special="promFinal" value="'+(s.promFinal==null?'':s.promFinal)+'"></div>'+
    '</div></div>');

  html.push('</div>');
  return html.join('');

/* ---------------- Main render ---------------- */
function render(){
  const app=document.getElementById('app');
  let html;
  if(route.view==='home') html=renderHome();
  else if(route.view==='group') html=renderGroup(route.gid);
  else if(route.view==='attendance') html=renderAttendance(route.gid, route.tab||'take');
  else if(route.view==='notas') html=renderNotas(route.gid, route.tab||'list');
  else if(route.view==='student') html=renderStudent(route.gid,route.sid);
  else if(route.view==='manage') html=renderManage(route.gid);
  else if(route.view==='backup') html=renderBackup();
  else html=renderHome();
  app.innerHTML=html;
}

function rerenderGradeView(){
  const active=document.activeElement;
  const isGrade = active && active.getAttribute && active.getAttribute('data-grade')==='1';
  const attrs = isGrade ? {
    sid:active.getAttribute('data-sid'), e:active.getAttribute('data-e'),
    ev:active.getAttribute('data-ev'), f:active.getAttribute('data-f'),
    special:active.getAttribute('data-special')
  } : null;
  const cursorPos = isGrade ? active.selectionStart : null;
  const app=document.getElementById('app');
  if(route.view==='student') app.innerHTML=renderStudent(route.gid,route.sid);
  else if(route.view==='notas') app.innerHTML=renderNotas(route.gid, route.tab||'list');
  if(attrs){
    let sel;
    if(attrs.special) sel='[data-special="'+attrs.special+'"][data-sid="'+CSS.escape(attrs.sid)+'"]';
    else sel='[data-sid="'+CSS.escape(attrs.sid)+'"][data-e="'+attrs.e+'"][data-ev="'+attrs.ev+'"][data-f="'+attrs.f+'"]';
    const el=document.querySelector(sel);
    if(el){ el.focus(); if(cursorPos!=null){ try{ el.selectionStart=el.selectionEnd=cursorPos; }catch(e){} } }
  }
}

function advanceQuickFocus(el){
  const sid=el.getAttribute('data-sid'), f=el.getAttribute('data-f');
  const g=Store.getGroup(route.gid);
  const s=g && g.students.find(x=>x.id===sid);
  let nextSel=null;
  if(s){
    const ev=s.ejes[quickEje].evals[quickNota];
    if(f==='n' && ev.n!=null && ev.n<7) nextSel='[data-quick="1"][data-sid="'+CSS.escape(sid)+'"][data-f="r1"]';
    else if(f==='r1' && ev.r1!=null && ev.r1<7) nextSel='[data-quick="1"][data-sid="'+CSS.escape(sid)+'"][data-f="r2"]';
  }
  if(nextSel){
    const nextEl=document.querySelector(nextSel);
    if(nextEl){ nextEl.focus(); nextEl.select(); return; }
  }
  const rows=Array.from(document.querySelectorAll('.quick-row'));
  const curRow=el.closest('.quick-row');
  const idx=rows.indexOf(curRow);
  if(idx>=0 && idx+1<rows.length){
    const nextN=rows[idx+1].querySelector('[data-f="n"]');
    if(nextN){ nextN.focus(); nextN.select(); return; }
  }
  el.blur();
  toast('Fin de la lista');
}

/* ---------------- Events (delegation) ---------------- */
document.addEventListener('click', function(e){
  const navEl=e.target.closest('[data-nav]');
  if(navEl){ nav(JSON.parse(navEl.getAttribute('data-nav'))); return; }

  const qe=e.target.closest('[data-quickeje]');
  if(qe){ quickEje=parseInt(qe.getAttribute('data-quickeje'),10); render(); return; }
  const qn=e.target.closest('[data-quicknota]');
  if(qn){ quickNota=parseInt(qn.getAttribute('data-quicknota'),10); render(); return; }

  const attBtn=e.target.closest('[data-att]');
  if(attBtn){
    const sid=attBtn.getAttribute('data-att'), code=attBtn.getAttribute('data-code');
    if(attRecordsCache[sid]===code) delete attRecordsCache[sid];
    else attRecordsCache[sid]=code;
    const row=attBtn.closest('.roster-row');
    row.querySelectorAll('.attbtn').forEach(b=>{
      b.className='attbtn'+(attRecordsCache[sid]===b.getAttribute('data-code')?' on-'+b.getAttribute('data-code').toLowerCase():'');
    });
    Store.saveAttendance(route.gid, attDate, Object.assign({},attRecordsCache));
    updateAttChips();
    toastSoon('Guardado');
    return;
  }

  if(e.target.id==='markAllPresent'){
    const g=Store.getGroup(route.gid);
    g.students.forEach(s=>attRecordsCache[s.id]='P');
    Store.saveAttendance(route.gid, attDate, Object.assign({},attRecordsCache));
    document.getElementById('app').innerHTML=renderAttendance(route.gid, route.tab||'take');
    toast('Guardado');
    return;
  }
  if(e.target.id==='clearAll'){
    attRecordsCache={};
    Store.saveAttendance(route.gid, attDate, Object.assign({},attRecordsCache));
    document.getElementById('app').innerHTML=renderAttendance(route.gid, route.tab||'take');
    toast('Guardado');
    return;
  }
  if(e.target.id==='addStudentBtn'){
    const inp=document.getElementById('newStudentName');
    const name=(inp.value||'').trim();
    if(!name) return;
    const g=Store.getGroup(route.gid);
    const id='s'+Date.now()+Math.floor(Math.random()*1000);
    g.students.push({id:id, name:name.toUpperCase(), ejes:[0,1,2,3].map(()=>({evals:[{n:null,r1:null,r2:null},{n:null,r1:null,r2:null}]})), jis1:{n:null,r:null}, jis2:{n:null,r:null}, coloquioDic:null, coloquioFeb:null, promFinal:null});
    Store.saveGroup(g);
    inp.value='';
    toast('Alumno agregado');
    return;
  }
  const rm=e.target.closest('[data-remove]');
  if(rm){
    const sid=rm.getAttribute('data-remove');
    const g=Store.getGroup(route.gid);
    if(confirm('¿Quitar a este alumno de la lista?')){
      g.students=g.students.filter(s=>s.id!==sid);
      Store.saveGroup(g);
      toast('Alumno quitado');
      render();
    }
    return;
  }

  if(e.target.id==='exportBtn'){ doExport(); return; }
  if(e.target.id==='copyExportBtn'){
    const ta=document.getElementById('exportText');
    ta.style.display='block';
    ta.select();
    try{ document.execCommand('copy'); }catch(err){}
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(()=>toast('Copiado')).catch(()=>{});
    }
    return;
  }
  if(e.target.id==='importTextBtn'){
    const ta=document.getElementById('importText');
    const text=(ta.value||'').trim();
    if(!text) return;
    doImport(text);
    return;
  }
});

document.addEventListener('change', function(e){
  if(e.target.hasAttribute('data-rename')){
    const sid=e.target.getAttribute('data-rename');
    const g=Store.getGroup(route.gid);
    const s=g.students.find(x=>x.id===sid);
    const name=(e.target.value||'').trim();
    if(s && name){ s.name=name; Store.saveGroup(g); toast('Guardado'); }
    return;
  }
  if(e.target.id==='importFile'){
    const file=e.target.files && e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>doImport(reader.result);
    reader.readAsText(file);
    return;
  }
});

document.addEventListener('input', function(e){
  if(e.target.id==='searchInput'){
    searchQ=e.target.value;
    const app=document.getElementById('app');
    if(route.view==='notas') app.innerHTML=renderNotas(route.gid, route.tab||'list');
    else if(route.view==='attendance') app.innerHTML=renderAttendance(route.gid, route.tab||'take');
    const si=document.getElementById('searchInput');
    if(si){ si.focus(); si.selectionStart=si.selectionEnd=si.value.length; }
    return;
  }
  if(e.target.id==='attDateInput'){
    attDate=e.target.value;
    render();
    return;
  }
  if(e.target.getAttribute('data-grade')==='1'){
    const sid=e.target.getAttribute('data-sid');
    const g=Store.getGroup(route.gid);
    const s=g.students.find(x=>x.id===sid);
    if(!s) return;
    const val=clampGrade(e.target.value);
    const special=e.target.getAttribute('data-special');
    if(special){
      if(special==='jis1n') s.jis1.n=val;
      else if(special==='jis1r') s.jis1.r=val;
      else if(special==='jis2n') s.jis2.n=val;
      else if(special==='jis2r') s.jis2.r=val;
      else s[special]=val;
    } else {
      const ei=parseInt(e.target.getAttribute('data-e'),10);
      const vi=parseInt(e.target.getAttribute('data-ev'),10);
      const f=e.target.getAttribute('data-f');
      s.ejes[ei].evals[vi][f]=val;
      if(f==='n' && val!=null && val>=7){ s.ejes[ei].evals[vi].r1=null; s.ejes[ei].evals[vi].r2=null; }
      if(f==='r1' && val!=null && val>=7){ s.ejes[ei].evals[vi].r2=null; }
    }
    Store.saveGroup(g);
    toastSoon('Guardado');
    if(!special) rerenderGradeView();
    return;
  }
});

document.addEventListener('keydown', function(e){
  if(e.key!=='Enter') return;
  const t=e.target;
  if(t && t.getAttribute && t.getAttribute('data-quick')==='1'){
    e.preventDefault();
    advanceQuickFocus(t);
  }
});

function updateAttChips(){
  const counts={P:0,A:0,T:0,J:0};
  Object.values(attRecordsCache).forEach(v=>{ if(counts[v]!=null) counts[v]++; });
  const chips=document.querySelectorAll('.att-summary-row .chip');
  if(chips[0]) chips[0].textContent='P '+counts.P;
  if(chips[1]) chips[1].textContent='A '+counts.A;
  if(chips[2]) chips[2].textContent='T '+counts.T;
  if(chips[3]) chips[3].textContent='J '+counts.J;
}

/* ---------------- Backup: export / import ---------------- */
async function doExport(){
  const json=Store.exportAll();
  const filename='cuaderno-del-profe-'+todayISO()+'.json';
  try{
    if(navigator.share && navigator.canShare){
      const file=new File([json], filename, {type:'application/json'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'Copia de seguridad — Cuaderno del Profe'});
        toast('Compartido');
        return;
      }
    }
  }catch(err){ /* usuario canceló o no soportado: mostramos el texto abajo */ }
  const ta=document.getElementById('exportText');
  const btn=document.getElementById('copyExportBtn');
  if(ta){ ta.value=json; ta.style.display='block'; }
  if(btn) btn.style.display='inline-block';
}
function doImport(text){
  if(!confirm('Esto reemplaza todos los datos actuales de la app por los del archivo. ¿Continuar?')) return;
  try{
    Store.importAll(text);
    toast('Datos restaurados');
    nav({view:'home'});
  }catch(err){
    alert('No se pudo leer el archivo: no es una copia de seguridad válida.');
  }
}

/* ---------------- Init ---------------- */
Store.onChange(()=>{ render(); });
Store.init();
})();
</script>
